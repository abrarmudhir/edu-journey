<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Time It</title>
  <style>
    :root{color-scheme:dark}*{box-sizing:border-box}body{--bg:#10182b;--accent:#7dd3fc;--panel:rgba(255,255,255,.1);margin:0;min-height:100vh;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 50% 26%,#243b6f 0,var(--bg) 58%);color:#f8fafc;font:500 16px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif;transition:background .45s ease}body:before,body:after{content:"";position:fixed;width:42vmax;height:42vmax;border-radius:50%;filter:blur(80px);opacity:.16;pointer-events:none}body:before{background:#38bdf8;left:-22vmax;top:-24vmax}body:after{background:#8b5cf6;right:-24vmax;bottom:-28vmax}main{width:min(92vw,680px);text-align:center;position:relative;z-index:1}h1{margin:0 0 22px;font-size:.85rem;letter-spacing:.28em;text-transform:uppercase;opacity:.78}.timer{position:relative;width:min(72vw,390px);aspect-ratio:1;margin:auto;display:grid;place-items:center}svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);filter:drop-shadow(0 14px 20px rgba(0,0,0,.24))}.track{fill:none;stroke:rgba(255,255,255,.12);stroke-width:9}.progress{fill:none;stroke:var(--accent);stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset .3s linear,stroke .4s ease}.clock{width:74%;aspect-ratio:1;border-radius:50%;display:grid;place-content:center;background:linear-gradient(145deg,rgba(255,255,255,.14),rgba(255,255,255,.035));box-shadow:inset 0 1px rgba(255,255,255,.18),0 24px 45px rgba(0,0,0,.2);backdrop-filter:blur(8px)}#display{margin:0;font-size:clamp(4.1rem,16vw,7.9rem);font-variant-numeric:tabular-nums;font-weight:750;letter-spacing:-.075em;line-height:1;text-shadow:0 5px 24px rgba(0,0,0,.18)}#status{min-height:1.5em;margin:19px 0 27px;color:#dbeafe;font-size:.78rem;font-weight:750;letter-spacing:.15em;text-transform:uppercase}.controls{display:flex;justify-content:center;flex-wrap:wrap;gap:10px}button,input{border:0;border-radius:12px;font:inherit;color:inherit}button{min-width:100px;padding:12px 17px;cursor:pointer;background:var(--panel);font-weight:750;box-shadow:inset 0 1px rgba(255,255,255,.12);transition:transform .12s,background .2s}button:hover:not(:disabled){background:rgba(255,255,255,.18)}button:active:not(:disabled){transform:scale(.96)}button:disabled{opacity:.42;cursor:not-allowed}button.primary{background:var(--accent);color:#082031;box-shadow:none}button.primary:hover:not(:disabled){background:#bae6fd}.settings{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:10px 14px;margin:25px auto 0}.set-time,.sound-toggle{display:flex;align-items:center;gap:8px;padding:9px 12px 9px 15px;border-radius:13px;background:var(--panel)}input{width:4.5ch;padding:4px 2px;background:transparent;text-align:center;font-size:1.05rem;font-weight:750;outline:1px solid rgba(255,255,255,.25)}label{font-size:.85rem;opacity:.84}.sound-toggle{padding:0}.sound-toggle button{min-width:0;padding:9px 13px;font-size:.85rem}body.warning{--bg:#a91f2a;--accent:#fecaca}body.flashing{animation:flash .72s steps(1,end) infinite}body.done{--bg:#44161d;--accent:#fda4af}body.done .clock{animation:done-pulse 1.2s ease-in-out infinite}@keyframes flash{50%{background:#fff0bb;color:#4b1017}}@keyframes done-pulse{50%{transform:scale(1.025)}}@media (prefers-reduced-motion:reduce){body.flashing,body.done .clock{animation:none}}
  </style>
</head>
<body>
  <main>
    <h1>Time It</h1>
    <div class="timer"><svg viewBox="0 0 100 100" aria-hidden="true"><circle class="track" cx="50" cy="50" r="45"/><circle id="progress" class="progress" cx="50" cy="50" r="45" pathLength="100" stroke-dasharray="100" stroke-dashoffset="0"/></svg><div class="clock"><p id="display" aria-live="polite">05:00</p></div></div>
    <p id="status">Ready when you are</p>
    <div class="controls"><button class="primary" id="start" type="button">Start</button><button id="pause" type="button" disabled>Pause</button><button id="reset" type="button">Reset</button></div>
    <div class="settings"><div class="set-time"><label for="minutes">Duration</label><input id="minutes" type="number" min="1" max="999" value="5" inputmode="numeric" aria-label="Timer duration in minutes"><span>min</span></div><div class="sound-toggle"><button id="sound" type="button" aria-pressed="true">🔊 Sound on</button></div></div>
  </main>
  <script>
    const display=document.querySelector('#display'),status=document.querySelector('#status'),progress=document.querySelector('#progress'),startButton=document.querySelector('#start'),pauseButton=document.querySelector('#pause'),resetButton=document.querySelector('#reset'),minutesInput=document.querySelector('#minutes'),soundButton=document.querySelector('#sound');
    let duration=300,remaining=duration,deadline=null,timerId=null,soundOn=true,lastSecond=null,audioContext;
    const format=s=>`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
    const minutesText=s=>`${s/60} ${s===60?'minute':'minutes'}`;
    function tone(notes,type='sine'){if(!soundOn)return;audioContext??=new AudioContext();const now=audioContext.currentTime;notes.forEach(([frequency,at,length=.12])=>{const oscillator=audioContext.createOscillator(),gain=audioContext.createGain();oscillator.type=type;oscillator.frequency.value=frequency;gain.gain.setValueAtTime(.0001,now+at);gain.gain.exponentialRampToValueAtTime(.16,now+at+.015);gain.gain.exponentialRampToValueAtTime(.0001,now+at+length);oscillator.connect(gain).connect(audioContext.destination);oscillator.start(now+at);oscillator.stop(now+at+length+.02)})}
    function announce(text){if(soundOn&&'speechSynthesis'in window){speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(text))}}
    function cue(s){if(s===duration){tone([[523,0,.12],[659,.16,.12],[784,.32,.2]]);announce(`Timer started for ${minutesText(duration)}.`);return}const halfway=s===Math.floor(duration/2),oneMinute=s===60,thirty=s===30;if(halfway)tone([[659,0,.14],[784,.18,.16]]);if(oneMinute)tone([[880,.48,.18],[880,.76,.18]]);if(thirty)tone([[988,1.05,.14],[988,1.25,.14],[988,1.45,.14]]);if(s===0){tone([[784,0,.18],[659,.22,.18],[523,.44,.38]],'triangle');announce('Time is up.')}else if(thirty){announce('Thirty seconds left.')}else if(oneMinute){announce('One minute left.')}else if(halfway){announce('Halfway there.')}}
    function paint(){display.textContent=format(remaining);progress.style.strokeDashoffset=100-(remaining/duration*100);document.body.classList.toggle('warning',remaining>30&&remaining<=60);document.body.classList.toggle('flashing',remaining>0&&remaining<=30);document.body.classList.toggle('done',remaining===0);if(remaining===0)status.textContent='Time is up';else if(remaining<=30&&deadline)status.textContent='30-second warning';else if(remaining<=60&&deadline)status.textContent='1 minute left';else if(deadline)status.textContent=`${Math.round(remaining/duration*100)}% remaining`;else status.textContent=remaining===duration?'Ready when you are':'Paused'}
    function stop(){clearInterval(timerId);timerId=null;deadline=null;startButton.disabled=false;pauseButton.disabled=true;startButton.textContent=remaining===duration?'Start':'Resume'}
    function tick(){remaining=Math.max(0,Math.ceil((deadline-Date.now())/1000));if(remaining!==lastSecond){cue(remaining);lastSecond=remaining}paint();if(remaining===0)stop()}
    function start(){if(remaining===0)reset();deadline=Date.now()+remaining*1000;timerId=setInterval(tick,200);startButton.disabled=true;pauseButton.disabled=false;minutesInput.disabled=true;lastSecond=null;tick()}
    function reset(){stop();duration=Math.max(1,Math.min(999,Number(minutesInput.value)||5))*60;minutesInput.value=duration/60;remaining=duration;lastSecond=null;minutesInput.disabled=false;if('speechSynthesis'in window)speechSynthesis.cancel();paint()}
    startButton.addEventListener('click',start);pauseButton.addEventListener('click',()=>{stop();paint()});resetButton.addEventListener('click',reset);minutesInput.addEventListener('change',reset);soundButton.addEventListener('click',()=>{soundOn=!soundOn;soundButton.textContent=soundOn?'🔊 Sound on':'🔇 Sound off';soundButton.setAttribute('aria-pressed',soundOn);if(soundOn)tone([[660,0,.1]])});paint();
  </script>
</body>
</html>
